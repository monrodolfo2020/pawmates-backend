name: pawmates-backend

# The database is a local libSQL file (or, with TURSO_DATABASE_URL set,
# Turso itself) — see README's Database section. No separate database
# service, and no Redis either (the idempotency cache that used to need
# it now lives in the same database — see README) — just this one
# container plus a volume so the db file survives a restart.
services:
  pawmates-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      SQLITE_LOCAL_PATH: /data/pawmates.db
      # To point this at Turso instead of the local file, set
      # TURSO_DATABASE_URL / TURSO_AUTH_TOKEN here (they take priority
      # over SQLITE_LOCAL_PATH — see libsql-connection.ts).
      JWT_SECRET: dev-secret-change-me
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
