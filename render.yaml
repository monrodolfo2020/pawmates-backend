# Render Blueprint — consolidated PawMates MVP (see README): one web
# service, a managed Postgres, a managed Redis. No broker, no payment
# info required — every resource here is on Render's free plan.
databases:
  - name: pawmates-db
    databaseName: pawmates
    user: pawmates
    plan: free
    postgresMajorVersion: '16'

services:
  - type: redis
    name: pawmates-redis
    plan: free
    ipAllowList: [] # private-network only, no public access

  - type: web
    name: pawmates-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '3000'
      - key: JWT_SECRET
        value: dev-secret-change-me
      - key: DB_HOST
        fromDatabase: { name: pawmates-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pawmates-db, property: port }
      - key: DB_USER
        fromDatabase: { name: pawmates-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pawmates-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: pawmates-db, property: database }
      - key: REDIS_URL
        fromService: { type: redis, name: pawmates-redis, property: connectionString }
