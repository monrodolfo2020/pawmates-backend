# Render Blueprint — consolidated PawMates MVP (see README): a single web
# service, on Render's free plan, no payment info required.
#
# The database itself is Turso (libSQL), not a Render-managed resource —
# see README's Database section. TURSO_DATABASE_URL/TURSO_AUTH_TOKEN
# below are `sync: false` (Render prompts for them in the dashboard
# instead of this file storing/generating them) because they come from
# your own Turso account, which nothing here has access to. No Redis
# either — the idempotency cache that used to need it now lives in the
# same Turso database (see README).
services:
  - type: web
    name: pawmates-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '3000'
      # Render generates and stores a real random value once at creation
      # (not re-generated on later syncs) — unlike docker-compose.yml's
      # shared dev-secret-change-me, this one is never visible in the repo
      # or in chat. Fine here since there's only one service verifying its
      # own tokens; if a second service needs to verify the same tokens
      # later, share this value via `fromService`, not a second
      # generateValue (that would mint a different secret).
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
