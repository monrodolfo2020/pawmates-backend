# Render Blueprint — deploys all 15 pawmates-backend services plus
# Postgres, Redis, and a single-node Redpanda broker, mirroring
# docker-compose.yml's topology on Render's infrastructure instead of a
# local machine.
#
# Validated against Render's own Blueprint preview (open this file in
# Render's "New > Blueprint" flow, which validates syntax and shows every
# resource it's about to create *without creating anything*) — the
# `fromDatabase` properties and `redpanda`'s `runtime: image` block both
# came back clean; the one real issue it caught (`preDeployCommand` isn't
# available on `free` plans) is already fixed below.
#
# Every service reaches every other by service name over Render's private
# network (e.g. `trust-safety-svc:50053`), the same convention
# docker-compose.yml uses locally — see the Dockerfile's comment for why
# no service needs its own build args anymore.
#
# Plans: everything is `free`, including `redpanda` — see its own comment
# below for the tradeoff that accepts, DEPLOY.md's Cost section for the
# free-tier Postgres expiration caveat, and bump `redpanda` to `starter`
# (~$7/mo, the only thing in this Blueprint that would cost anything) if
# that tradeoff turns out not to work.

databases:
  - name: pawmates-db
    databaseName: pawmates
    user: pawmates
    plan: free
    postgresMajorVersion: '16'

services:
  - type: redis
    name: pawmates-redis
    plan: free
    ipAllowList: [] # private-network only, no public access

  # No managed Kafka on Render — runs Redpanda's own public image directly
  # (not this repo's Dockerfile) as a private, non-internet-facing service.
  # On `free` to avoid requiring payment info at all — accepted tradeoff:
  # a free private service may not "wake" the way a free *web* service does
  # (that relies on an inbound HTTP request; a raw Kafka TCP connection from
  # another private service may not trigger it), so booking-svc/commerce-svc
  # could fail their Kafka connection if Redpanda has spun down. Bump this
  # single resource back to `starter` (~$7/mo) if that turns out to bite.
  - type: pserv
    name: redpanda
    runtime: image
    image:
      url: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    plan: free
    dockerCommand: >-
      redpanda start --smp=1 --memory=1G --reserve-memory=0M
      --overprovisioned --node-id=0 --check=false
      --kafka-addr=PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    disk:
      name: redpanda-data
      mountPath: /var/lib/redpanda/data
      sizeGB: 10

  # --- Full implementation (real domain/persistence layers) ---

  - type: web
    name: booking-svc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Free plan doesn't support Pre-Deploy Command, so the migration runs as
    # part of the container's own startup instead — safe to repeat on every
    # boot (TypeORM skips already-applied migrations), which also covers
    # free-tier spin-down/wake cycles that a one-time pre-deploy step
    # wouldn't.
    dockerCommand: >-
      sh -c "npx ts-node -r tsconfig-paths/register
      ./node_modules/typeorm/cli.js migration:run -d
      apps/booking-svc/src/infra/persistence/data-source.ts &&
      node dist/apps/booking-svc/apps/booking-svc/src/main.js"
    envVars:
      - key: APP_NAME
        value: booking-svc
      - key: PORT
        value: '3005'
      - key: GRPC_PORT
        value: '50055'
      # Matches docker-compose.yml's dev secret — both services verifying
      # tokens off the same JwtAuthGuard need to share one value, not each
      # get their own generated one (see DEPLOY.md before using this for
      # anything beyond a reference deployment).
      - key: JWT_SECRET
        value: dev-secret-change-me
      - key: DB_HOST
        fromDatabase: { name: pawmates-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pawmates-db, property: port }
      - key: DB_USER
        fromDatabase: { name: pawmates-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pawmates-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: pawmates-db, property: database }
      - key: REDIS_URL
        fromService: { type: redis, name: pawmates-redis, property: connectionString }
      - key: KAFKA_BROKERS
        value: redpanda:9092
      - key: MARKETPLACE_GRPC_URL
        value: marketplace-svc:50052
      - key: TRUST_SAFETY_GRPC_URL
        value: trust-safety-svc:50053
      - key: PAYMENTS_GRPC_URL
        value: payments-svc:50054

  - type: web
    name: commerce-svc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # See booking-svc's dockerCommand comment above — same reason.
    dockerCommand: >-
      sh -c "npx ts-node -r tsconfig-paths/register
      ./node_modules/typeorm/cli.js migration:run -d
      apps/commerce-svc/src/infra/persistence/data-source.ts &&
      node dist/apps/commerce-svc/apps/commerce-svc/src/main.js"
    envVars:
      - key: APP_NAME
        value: commerce-svc
      - key: PORT
        value: '3015'
      # Matches docker-compose.yml's dev secret — both services verifying
      # tokens off the same JwtAuthGuard need to share one value, not each
      # get their own generated one (see DEPLOY.md before using this for
      # anything beyond a reference deployment).
      - key: JWT_SECRET
        value: dev-secret-change-me
      - key: DB_HOST
        fromDatabase: { name: pawmates-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pawmates-db, property: port }
      - key: DB_USER
        fromDatabase: { name: pawmates-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pawmates-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: pawmates-db, property: database }
      - key: REDIS_URL
        fromService: { type: redis, name: pawmates-redis, property: connectionString }
      - key: KAFKA_BROKERS
        value: redpanda:9092
      - key: TRUST_SAFETY_GRPC_URL
        value: trust-safety-svc:50053
      - key: PAYMENTS_GRPC_URL
        value: payments-svc:50054
      - key: BOOKING_GRPC_URL
        value: booking-svc:50055

  # --- gRPC stubs (Prompt 5 scope: just enough contract for the sagas above) ---

  - type: web
    name: marketplace-svc
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: marketplace-svc
      - key: PORT
        value: '3004'
