name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p apps/pawmates-api/tsconfig.app.json
      - run: npm test

  # The script lives in the app repo (pawmates); running it from here too
  # means a change to a shared list on this side is checked as well.
  shared-lists:
    name: Listas compartidas con la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pawmates-backend
      - uses: actions/checkout@v4
        with:
          repository: monrodolfo2020/pawmates
          path: pawmates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node pawmates/scripts/check-shared-lists.mjs --backend pawmates-backend --frontend pawmates

  # The app's end-to-end tests against this commit of the backend, so a
  # change here that breaks the app is caught here.
  e2e:
    name: Pruebas de punta a punta de la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pawmates-backend
      - uses: actions/checkout@v4
        with:
          repository: monrodolfo2020/pawmates
          path: pawmates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pawmates/package-lock.json
            pawmates-backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: pawmates-backend
      - run: npm ci
        working-directory: pawmates
      - run: npx playwright install --with-deps chromium
        working-directory: pawmates
      - run: npm run test:e2e
        working-directory: pawmates
        env:
          PAWMATES_BACKEND_DIR: ${{ github.workspace }}/pawmates-backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            pawmates/playwright-report/
            pawmates/test-results/
          retention-days: 7
