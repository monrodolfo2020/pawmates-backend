syntax = "proto3";

package pawmates.trust_safety;

// Mirrors "Contratos gRPC internos" (API Design doc, Sheet 4, §08).
service TrustSafetyService {
  rpc CheckVerificationValid(CheckVerificationValidRequest) returns (CheckVerificationValidResponse);
}

message CheckVerificationValidRequest {
  string account_id = 1;
  string required_level = 2; // basic | standard | enhanced
}

message CheckVerificationValidResponse {
  bool valid = 1;
  string expires_at = 2; // ISO-8601
}
