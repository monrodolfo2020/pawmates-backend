syntax = "proto3";

package pawmates.booking;

// Mirrors "Contratos gRPC internos" (API Design doc, Sheet 4, §08) — added
// for commerce-svc's RequiresUpcomingBookingPolicy (Prompt 5 follow-up:
// PawMates Commerce). booking-svc otherwise only calls other services; this
// is its one inbound gRPC method, alongside its REST API.
service BookingService {
  rpc GetUpcomingConfirmedBooking(GetUpcomingConfirmedBookingRequest) returns (GetUpcomingConfirmedBookingResponse);
}

message GetUpcomingConfirmedBookingRequest {
  string owner_id = 1;
  string provider_id = 2;
}

message GetUpcomingConfirmedBookingResponse {
  bool found = 1;
  string booking_id = 2;
  string scheduled_at = 3; // ISO-8601, empty if !found
}
