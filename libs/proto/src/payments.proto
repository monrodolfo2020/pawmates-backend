syntax = "proto3";

package pawmates.payments;

// Mirrors "Contratos gRPC internos" (API Design doc, Sheet 4, §08).
service PaymentsService {
  rpc AuthorizePayment(AuthorizePaymentRequest) returns (AuthorizePaymentResponse);
  rpc CapturePayment(CapturePaymentRequest) returns (CapturePaymentResponse);
  rpc ChargeOrder(ChargeOrderRequest) returns (ChargeOrderResponse);
  rpc RefundOrder(RefundOrderRequest) returns (RefundOrderResponse);
}

message AuthorizePaymentRequest {
  string booking_id = 1;
  int64 amount = 2; // minor currency unit
  string currency = 3;
  string payment_method_id = 4;
  string idempotency_key = 5;
}

message AuthorizePaymentResponse {
  string transaction_id = 1;
  string status = 2; // authorized | failed
}

message CapturePaymentRequest {
  string transaction_id = 1;
  int64 final_amount = 2;
}

message CapturePaymentResponse {
  string status = 1; // captured | failed
}

// PawMates Commerce (Prompt 5 follow-up) — a storefront Order is charged
// in full at checkout, unlike a Booking (authorized at accept, captured at
// completion), so it gets its own pair of RPCs rather than reusing
// Authorize/Capture.
message ChargeOrderRequest {
  string order_id = 1;
  int64 amount = 2; // minor currency unit
  string currency = 3;
  string payment_method_id = 4;
  string idempotency_key = 5;
}

message ChargeOrderResponse {
  string transaction_id = 1;
  string status = 2; // captured | failed
}

message RefundOrderRequest {
  string transaction_id = 1;
  int64 amount = 2;
}

message RefundOrderResponse {
  string status = 1; // refunded | failed
}
